name: dramatiq

services:
  app:
    image: dramatiq-expense-visualizer:local
    build:
      context: .
      args:
        NEXT_PUBLIC_EXPENSE_API_URL: ${NEXT_PUBLIC_EXPENSE_API_URL:-http://localhost:3001}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      POSTGRES_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
      - "127.0.0.1:${API_PORT:-3001}:${API_PORT:-3001}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.API_PORT || '3001') + '/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
